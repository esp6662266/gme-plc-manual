name: Import verified GME website source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore verified website files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          allowed = {'.gitignore', 'README.md', 'package.json', 'package-lock.json', 'netlify.toml'}
          prefixes = ('manual/', 'src/', 'scripts/', 'netlify/functions/', 'tests/')
          root = Path.cwd().resolve()
          with ZipFile('GME_netlify_source.zip') as archive:
              files = archive.infolist()
              assert len(files) == 38, 'Unexpected source file count'
              assert sum(item.file_size for item in files) < 10 * 1024 * 1024
              for item in files:
                  name = item.filename
                  path = PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert name in allowed or name.startswith(prefixes)
                  target = (root / name).resolve()
                  assert target.is_relative_to(root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          print('Restored 38 verified GME website source files.')
          PY
          git config user.name 'GME documentation import'
          git config user.email '214255854+esp6662266@users.noreply.github.com'
          git add .gitignore README.md package.json package-lock.json netlify.toml manual src scripts netlify/functions tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add verified GME HMI PLC manual and Netlify website source'
          git push origin HEAD:main
