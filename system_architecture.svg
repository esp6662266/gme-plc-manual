<text x="45" y="783" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="normal" fill="#536273">구성 설명용 화살표다. PLC 온라인 프로그램 일치와 장치별 태그 품질은 추가 확인 대상이다. 10월 7일에는 유선 링크 단절이</text>
<text x="45" y="815" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="normal" fill="#536273">관찰됐다.</text>
