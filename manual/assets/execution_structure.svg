<text x="45" y="1013" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="normal" fill="#536273">주기 OB는 Main과 별도로 실행된다. 실제 호출 조건, 주기와 우선순위는 원본 네트워크 및 OB 속성에서 확인한다.</text>
